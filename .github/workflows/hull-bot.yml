name: Hull property alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install requests beautifulsoup4

      - name: Check Places for People
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          import re
          import json
          import os
          import subprocess
          from urllib.parse import urljoin

          SEARCH_URL = (
              "https://rent.placesforpeople.co.uk/properties.aspx"
              "?bed=2"
              "&lat=53.7674909"
              "&loc=Hull"
              "&lon=-0.3273025"
              "&max=9999"
              "&mil=15"
              "&overfifty=2"
              "&pag=1"
              "&typ=0"
          )

          STATE_FILE = "seen_properties.json"

          BASE_URL = "https://rent.placesforpeople.co.uk"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 Safari/604.1"
              )
          }

          # Allowed areas:
          # Hull = HU1-HU9
          # Anlaby / Willerby = HU10
          # Hessle = HU13
          allowed_postcodes = re.compile(
              r"\bHU(?:[1-9]|10|13)\s?\d[A-Z]{2}\b",
              re.IGNORECASE
          )

          allowed_places = [
              "hull",
              "anlaby",
              "willerby",
              "hessle"
          ]

          rejected_places = [
              "beverley"
          ]

          print("Checking Places for People...")
          print("Search area: Hull + Hessle + Anlaby + Willerby")
          print("Maximum rent: £750")
          print("Minimum bedrooms: 2")

          response = requests.get(
              SEARCH_URL,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          print("Website response:", response.status_code)

          soup = BeautifulSoup(
              response.text,
              "html.parser"
          )

          candidate_links = set()

          # Find property links
          for link in soup.find_all("a", href=True):

              href = link.get("href", "")

              if "property.aspx" not in href.lower():
                  continue

              full_url = urljoin(
                  BASE_URL,
                  href
              )

              candidate_links.add(full_url)

          print(
              "Property links found:",
              len(candidate_links)
          )

          properties = {}

          # Check every individual property
          for property_url in candidate_links:

              try:

                  page = requests.get(
                      property_url,
                      headers=headers,
                      timeout=30
                  )

                  if page.status_code != 200:
                      continue

                  detail = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  text = " ".join(
                      detail.stripped_strings
                  )

                  lower = text.lower()

                  # ------------------------------------------------
                  # LOCATION
                  # ------------------------------------------------

                  # Explicitly reject Beverley
                  if any(
                      place in lower
                      for place in rejected_places
                  ):
                      print(
                          "Rejected location (Beverley):",
                          property_url
                      )
                      continue

                  postcode_match = allowed_postcodes.search(text)

                  place_match = any(
                      place in lower
                      for place in allowed_places
                  )

                  if not postcode_match and not place_match:
                      print(
                          "Rejected location:",
                          property_url
                      )
                      continue

                  # ------------------------------------------------
                  # PROPERTY TYPE
                  # ------------------------------------------------

                  if "house" not in lower:
                      continue

                  if (
                      "flat" in lower
                      or "apartment" in lower
                      or "bungalow" in lower
                  ):
                      continue

                  # ------------------------------------------------
                  # BEDROOMS
                  # ------------------------------------------------

                  bedroom_match = re.search(
                      r"(\d+)\s*bed(?:room)?s?",
                      lower
                  )

                  if not bedroom_match:
                      continue

                  bedrooms = int(
                      bedroom_match.group(1)
                  )

                  if bedrooms < 2:
                      continue

                  # ------------------------------------------------
                  # OVER 55
                  # ------------------------------------------------

                  if re.search(
                      r"over\s*55"
                      r"|over\s*fifty[\s-]*five"
                      r"|55\+"
                      r"|55\s*years",
                      lower
                  ):
                      continue

                  # ------------------------------------------------
                  # PRICE
                  # ------------------------------------------------

                  prices = re.findall(
                      r"£\s*([0-9,]+)",
                      text
                  )

                  if not prices:
                      continue

                  price = int(
                      prices[0].replace(",", "")
                  )

                  if price > 750:
                      continue

                  # ------------------------------------------------
                  # TITLE
                  # ------------------------------------------------

                  title = ""

                  for element in detail.find_all(
                      ["h1", "h2", "h3", "title"]
                  ):

                      candidate = " ".join(
                          element.stripped_strings
                      ).strip()

                      if candidate:
                          title = candidate
                          break

                  if not title:
                      title = (
                          f"{bedrooms} Bedroom House"
                      )

                  properties[property_url] = {
                      "title": title,
                      "price": price,
                      "bedrooms": bedrooms,
                      "url": property_url
                  }

                  print(
                      "MATCH:",
                      title,
                      "|",
                      bedrooms,
                      "bedrooms",
                      "| £" + str(price),
                      "|",
                      property_url
                  )

              except Exception as error:

                  print(
                      "Error checking property:",
                      property_url,
                      error
                  )

          print(
              "Matching properties found:",
              len(properties)
          )

          # ------------------------------------------------
          # LOAD PREVIOUS PROPERTIES
          # ------------------------------------------------

          old = {}

          if os.path.exists(STATE_FILE):

              try:

                  with open(
                      STATE_FILE,
                      "r"
                  ) as f:

                      old = json.load(f)

              except Exception:

                  old = {}

          # ------------------------------------------------
          # FIRST RUN
          # ------------------------------------------------

          if not old:

              print(
                  "First run detected - "
                  "saving current properties "
                  "without notifications."
              )

          # ------------------------------------------------
          # FIND NEW PROPERTIES
          # ------------------------------------------------

          new_properties = [
              property_data
              for url, property_data in properties.items()
              if url not in old
          ]

          print(
              "New properties:",
              len(new_properties)
          )

          # ------------------------------------------------
          # SEND NTFY
          # ------------------------------------------------

          if old and new_properties:

              topic = os.environ.get(
                  "NTFY_TOPIC",
                  ""
              ).strip()

              if topic:

                  for property_data in new_properties:

                      message = (
                          f"{property_data['title']}\n"
                          f"{property_data['bedrooms']} bedrooms\n"
                          f"Rent: £{property_data['price']} "
                          f"per month\n"
                          f"{property_data['url']}"
                      )

                      ntfy_response = requests.post(
                          f"https://ntfy.sh/{topic}",
                          data=message.encode("utf-8"),
                          headers={
                              "Title": "🏠 NEW HOUSE",
                              "Priority": "max",
                              "Tags": "house"
                          },
                          timeout=20
                      )

                      ntfy_response.raise_for_status()

                      print(
                          "Notification sent:",
                          property_data["url"]
                      )

              else:

                  print(
                      "NTFY_TOPIC secret is empty."
                  )

          # ------------------------------------------------
          # SAVE CURRENT PROPERTY LIST
          # ------------------------------------------------

          with open(
              STATE_FILE,
              "w"
          ) as f:

              json.dump(
                  properties,
                  f,
                  indent=2
              )

          # ------------------------------------------------
          # SAVE STATE TO GITHUB
          # ------------------------------------------------

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "Hull Property Bot"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "actions@github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  STATE_FILE
              ],
              check=True
          )

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--cached",
                  "--quiet"
              ]
          )

          if result.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update property list"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "push"
                  ],
                  check=True
              )

          print("Bot finished successfully.")

          PY
